name: Build & Deploy — CodeArena

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore backend/CodeArena.slnx

      - name: Build backend
        run: dotnet build backend/CodeArena.slnx --no-restore --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build -- --configuration=production
        working-directory: frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/codearena

            echo "📥 Pull des dernières modifications..."
            git pull origin main

            echo "🐳 Rebuild et redémarrage des conteneurs..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            echo "⏳ Attente santé de l'API (max 60s)..."
            timeout 60 bash -c \
              'until curl -sf http://localhost:5000/api/health; do sleep 3; done'

            echo "✅ Déploiement terminé."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps